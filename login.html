<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbon Footprint Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="logo" id="logo" href="acceuil.html">GreenCarbon</a>
      <ul>
        <li><a href="acceuil.html">Accueil</a></li>
        <li><a href="#" class="active">Se Connecter</a></li>
      </ul>    
    </nav>

  <main class="form-container">
    <h2>Se Connecter</h2>
    <div class="form-group">
      <input id ="email" type="email" placeholder="Email">
    </div>
    <div class="form-group">
      <input id ="password" type="password" placeholder="Mot de passe">
      <a href="#" class="forgot-password">Mot de passe oublié ?</a>
    </div>
    <button type="submit" id="login-btn">Se Connecter</button>
    <div class="login-link">
      Pas encore de compte? <a href="sign-up.html">Créer un compte</a>
    </div>
  </main>

  <footer style="position: fixed;">
    <p>© 2025 GreenCarbon. Tous droits réservés.</p>
  </footer>



  <script>
    document.getElementById('login-btn').addEventListener('click', async (e) => {
        e.preventDefault(); // Empêche le comportement par défaut
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
            alert('Email et mot de passe sont requis');
            return;
        }

        const data = {
            email: email,
            password: password,
        };

        try {
            const response = await fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            });

            const result = await response.json();

            if (response.ok) {
              localStorage.setItem('userId', result.userId); // Stocke l'ID de l'utilisateur
              //window.location.href = 'calculator.html'; // Redirige vers une page de profil ou autre
              // Vérifier si l'utilisateur est admin
              const check = await fetch(`http://localhost:3000/admin/check/${result.userId}`);
              const { isAdmin } = await check.json();
              if (isAdmin) {
                window.location.href = 'admin.html';
              } else {
                window.location.href = 'calculator.html';
              }
            } else {
                alert(result.message); 
            }
        } catch (error) {
            console.error('Erreur lors de la connexion:', error);
            alert('Erreur lors de la connexion');
        }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
