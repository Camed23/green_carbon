<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Admin - GreenCarbon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="logo" id="logo" href="acceuil.html">GreenCarbon</a>
    <ul>
      <li><a href="acceuil.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 12L13 12" stroke="#323232" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 15L20.913 12.087V12.087C20.961 12.039 20.961 11.961 20.913 11.913V11.913L18 9" stroke="#323232" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 5V4.5V4.5C16 3.67157 15.3284 3 14.5 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H14.5C15.3284 21 16 20.3284 16 19.5V19.5V19" stroke="#323232" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg></a></li>
    </ul>    
  </nav>

  <main class="container">
    <h1>Tableau de bord administrateur</h1>

    <table id="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Date d'inscription</th>
          <th>Supprimer</th> <!-- Nouvelle colonne -->
        </tr>
      </thead>
      
      <tbody id="user-table-body">
        <!-- Les lignes seront injectées ici -->
      </tbody>
    </table>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
  const userId = localStorage.getItem('userId');

  // Vérifie que l'utilisateur est bien admin
  const checkRes = await fetch(`http://localhost:3000/admin/check/${userId}`);
  const checkData = await checkRes.json();

  if (!checkData.isAdmin) {
    alert("Accès interdit : vous n'êtes pas administrateur.");
    window.location.href = "acceuil.html";
    return;
  }

  // Récupère tous les utilisateurs
  const response = await fetch('http://localhost:3000/all-users', {
    headers: { 'x-user-id': userId }
  });

  const users = await response.json();
  const tbody = document.getElementById('user-table-body');

  users.forEach(user => {
    // Condition pour exclure l'utilisateur avec l'email 'admin@gmail.com'
    if (user.email === 'admin@green.com') {
      return; // Ignore cette itération et passe à l'utilisateur suivant
    }

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${user.id}</td>
      <td>${user.username}</td>
      <td>${user.email}</td>
      <td>${new Date(user.created_at).toLocaleDateString()}</td>
      <td><button class="delete-btn" data-id="${user.id}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M18 6L17.1991 18.0129C17.129 19.065 17.0939 19.5911 16.8667 19.99C16.6666 20.3412 16.3648 20.6235 16.0011 20.7998C15.588 21 15.0607 21 14.0062 21H9.99377C8.93927 21 8.41202 21 7.99889 20.7998C7.63517 20.6235 7.33339 20.3412 7.13332 19.99C6.90607 19.5911 6.871 19.065 6.80086 18.0129L6 6M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M14 10V17M10 10V17" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg></button></td> <!-- Colonne pour supprimer -->
    `;
    tbody.appendChild(row);
  });

  // Ajouter un écouteur d'événements pour la suppression
  const deleteButtons = document.querySelectorAll('.delete-btn');
  deleteButtons.forEach(button => {
    button.addEventListener('click', async (event) => {
      const userIdToDelete = event.target.getAttribute('data-id');
      
      // Confirmation avant de supprimer
      if (confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')) {
        const deleteRes = await fetch(`http://localhost:3000/delete-user/${userIdToDelete}`, {
          method: 'DELETE',
        });

        if (deleteRes.ok) {
          alert('Utilisateur supprimé avec succès');
          window.location.reload(); // Recharge la page pour mettre à jour la liste
        } else {
          alert("Erreur lors de la suppression de l'utilisateur.");
        }
      }
    });
  });
});

  </script>
</body>
</html>
